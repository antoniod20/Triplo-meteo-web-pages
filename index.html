<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; frame-src https://www.3bmeteo.com https://www.google.com https://www.ilmeteo.it https://www.meteoeradar.it https://www.meteogiuliacci.it https://www.meteoam.it; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripolemme</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icons/icon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#E1EB87" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14141e" media="(prefers-color-scheme: dark)">
</head>

<body>

  <!-- Close Full View Button (Hidden by default) -->
  <button id="closeFullViewBtn" type="button">Chiudi Vista Completa ❌</button>

  <!-- TAB BAR MOBILE -->
  <nav class="tab-bar" aria-label="Fonti meteo">
    <button type="button" data-index="0" class="active">3BMeteo</button>
    <button type="button" data-index="1">Google</button>
    <button type="button" data-index="2">IlMeteo</button>
  </nav>

  <!-- AGENTE: previsione combinata dei modelli meteo -->
  <button id="agentBtn" type="button" aria-label="Previsione combinata dei modelli meteo" title="Previsione combinata"
    aria-haspopup="dialog" aria-controls="agentModal">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill-rule="evenodd"
        d="M12 1.5a1.5 1.5 0 0 1 .75 2.8V6H17a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3h4.25V4.3A1.5 1.5 0 0 1 12 1.5zM9 10.5a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5zm6 0a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5zM9 16v1.5h6V16H9zM1.5 11h1.5v4H1.5zM21 11h1.5v4H21z" />
    </svg>
  </button>

  <!-- FLOATING BUTTON -->
  <button id="settings" type="button" aria-label="Impostazioni" aria-haspopup="dialog" aria-controls="modal">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
    </svg>
  </button>

  <!-- IFRAME -->
  <main class="container">
    <div class="frame-wrapper">
      <iframe id="frame1" src="" title="Meteo 1"></iframe>
      <a class="float-btn open-btn" data-frame="frame1" href="#" target="_blank" rel="noopener noreferrer"
        aria-label="Apri in una nuova scheda" title="Apri in una nuova scheda">↗</a>
      <button type="button" class="float-btn vote-btn" data-frame="frame1" aria-pressed="false">⭐</button>
    </div>
    <div class="frame-wrapper">
      <iframe id="frame2" src="" title="Meteo 2"></iframe>
      <a class="float-btn open-btn" data-frame="frame2" href="#" target="_blank" rel="noopener noreferrer"
        aria-label="Apri in una nuova scheda" title="Apri in una nuova scheda">↗</a>
      <button type="button" class="float-btn vote-btn" data-frame="frame2" aria-pressed="false">⭐</button>
    </div>
    <div class="frame-wrapper">
      <iframe id="frame3" src="" title="Meteo 3"></iframe>
      <a class="float-btn open-btn" data-frame="frame3" href="#" target="_blank" rel="noopener noreferrer"
        aria-label="Apri in una nuova scheda" title="Apri in una nuova scheda">↗</a>
      <button type="button" class="float-btn vote-btn" data-frame="frame3" aria-pressed="false">⭐</button>
    </div>
  </main>

  <!-- MODALE -->
  <div id="modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div id="modalContent" class="dialog">
      <h3 id="modalTitle">Impostazioni Meteo</h3>

      <button id="fullViewBtn" type="button" class="primary-btn">Vista Completa 📸</button>

      <button id="manageProvidersBtn" type="button" class="primary-btn">Personalizza Fonti Meteo 🪛</button>

      <button id="shareBtn" type="button" class="primary-btn">Condividi link 🔗</button>
      <p id="shareFeedback" class="feedback" role="status" aria-live="polite"></p>

      <div class="toggle-container">
        <label for="voteToggle" class="toggle-label">Modalità Voto ⭐</label>
        <label class="switch">
          <input type="checkbox" id="voteToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <div id="rankingSection">
        <span class="input-label">Classifica meteo preferiti:</span>
        <div id="rankingContainer"></div>
        <button id="resetRanking" type="button">Reset Classifica 🗑️</button>
      </div>

      <hr class="separator">

      <span class="input-label">I tuoi preferiti:</span>
      <div id="favoritesContainer"></div>

      <hr class="separator">

      <label class="input-label" for="cityInput">Cerca nuova città:</label>
      <div class="input-group">
        <ul id="citySuggestions" class="suggestions" role="listbox" aria-label="Comuni suggeriti" hidden></ul>
        <input type="text" id="cityInput" role="combobox" aria-autocomplete="list" aria-expanded="false"
          aria-controls="citySuggestions" autocomplete="off" placeholder="es. Roma, Bari...">

        <button id="saveCity" type="button">Salva</button>
      </div>
    </div>
  </div>

  <!-- MODALE AGENTE -->
  <div id="agentModal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="agentTitle">
    <div class="dialog dialog-agent">
      <button type="button" class="dialog-close" id="closeAgentBtn" aria-label="Chiudi">✕</button>
      <h3 id="agentTitle">🤖 Previsione combinata</h3>
      <p id="agentCity" class="agent-city"></p>

      <div id="agentDays" class="agent-days" role="group" aria-label="Scegli il giorno"></div>

      <div id="agentResult" aria-live="polite"></div>

      <p class="agent-credits">
        Confronto tra i modelli ECMWF, ICON, GFS, Météo-France e ItaliaMeteo.
        Dati: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> (CC BY 4.0)
      </p>
    </div>
  </div>

  <!-- MODALE PERSONALIZZA FONTI -->
  <div id="providersModal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="providersTitle">
    <div class="dialog dialog-blue">
      <h3 id="providersTitle">Personalizza Fonti</h3>

      <div class="slot">
        <label for="slot1">1° Posto:</label>
        <select id="slot1"></select>
      </div>
      <div class="slot">
        <label for="slot2">2° Posto:</label>
        <select id="slot2"></select>
      </div>
      <div class="slot slot-last">
        <label for="slot3">3° Posto:</label>
        <select id="slot3"></select>
      </div>

      <button id="saveProvidersSetupBtn" type="button" class="primary-btn">Applica e Ricarica</button>
      <button id="closeProvidersModalBtn" type="button" class="secondary-btn">Annulla</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
